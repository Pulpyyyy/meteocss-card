name: Tests

on:
  workflow_call:
  pull_request:
  push:
    branches-ignore:
      - main
      - master

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run regression suite
        run: node tests/run-all.js
